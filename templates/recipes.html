<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kitchen Roots | Recipes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='recipe.css') }}">
  </head>

  <body>
    {% include "_site_header.html" %}

    <main class="recipe-shell">
      <header class="recipe-header">
        <p class="eyebrow">Explore the collection</p>
        <h1>Recipes</h1>
        <p class="description">
          Family recipes preserved with their stories, techniques, and roots.
        </p>

        <a class="primary-link" href="/recipes/new">Add a Recipe</a>
      </header>

      <form id="tag-filter-form" class="collection-filter">
        <label for="recipe-search">Search recipes by title</label>
        <input
          id="recipe-search"
          name="q"
          type="search"
          placeholder="Try Jollof Rice"
        >

        <label for="tag-filter">Filter recipes by tag</label>
        <div class="collection-filter-controls">
          <select id="tag-filter" name="tag_id">
            <option value="">All tags</option>
          </select>
          <button type="submit">Filter Recipes</button>
          <button type="button" class="filter-clear" data-clear-filter>
            Clear Filter
          </button>
        </div>
        <p id="filter-message" aria-live="polite"></p>
      </form>

      <section>
        <div id="recipe-list" class="recipe-list" aria-live="polite">
          <p class="loading">Loading recipes...</p>
        </div>
      </section>
    </main>

    {% include "_site_footer.html" %}

    <script src="{{ url_for('static', filename='recipes.js') }}"></script>
  </body>
</html>
