<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add a Recipe | Kitchen Roots</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='recipe.css') }}">
  </head>

  <body>
    <header class="site-header">
      <a class="brand" href="/">Kitchen Roots</a>
      <span>Preserve a recipe from the kitchen.</span>
    </header>

    <main class="recipe-shell form-page">
      <header class="recipe-header">
        <p class="eyebrow">Share your roots</p>
        <h1>Add a Recipe</h1>
      </header>

      <form id="recipe-form" class="recipe-form">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" required>

        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
          required
        ></textarea>

        <label for="prep-time">Prep time in minutes</label>
        <input
          id="prep-time"
          name="prep_time"
          type="number"
          min="0"
          required
        >

        <input name="user_id" type="hidden" value="1">

        <button type="submit">Save Recipe</button>
        <p id="form-message" aria-live="polite"></p>
      </form>
    </main>

    <script src="{{ url_for('static', filename='create_recipe.js') }}"></script>
  </body>
</html>
