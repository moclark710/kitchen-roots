<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add a Recipe | Kitchen Roots</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='recipe.css') }}">
  </head>

  <body>
    {% include "_site_header.html" %}

    <main class="recipe-shell form-page">
      <header class="recipe-header">
        <p class="eyebrow">Share your roots</p>
        <h1>Add a Recipe</h1>
        <p class="description">
          Start with the recipe basics. Next, you’ll add ingredients, cooking
          steps, tags, and notes in the full recipe editor.
        </p>
      </header>

      <form id="recipe-form" class="recipe-form">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" required>

        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
          required
        ></textarea>

        <label for="prep-time">Prep time in minutes</label>
        <input
          id="prep-time"
          name="prep_time"
          type="number"
          min="0"
          required
        >

        <label for="cook-time">Cook time in minutes</label>
        <input
          id="cook-time"
          name="cook_time"
          type="number"
          min="0"
          required
        >

        <input name="user_id" type="hidden" value="1">

        <button type="submit">Save &amp; Add Recipe Details</button>
        <p id="form-message" aria-live="polite"></p>
      </form>
    </main>

    {% include "_site_footer.html" %}

    <script src="{{ url_for('static', filename='create_recipe.js') }}"></script>
  </body>
</html>
