<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Recipe | Kitchen Roots</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='recipe.css') }}"
    >
  </head>

  <body>
    {% include "_site_header.html" %}

    <main class="recipe-shell form-page">
      <header class="recipe-header">
        <p class="eyebrow">Update your recipe</p>
        <h1>Edit Recipe</h1>
        <p class="description">Preserve a recipe from your kitchen.</p>
      </header>

      <form
        id="edit-recipe-form"
        class="recipe-form"
        data-recipe-id="{{ recipe_id }}"
      >
        <label for="title">Title</label>
        <input id="title" name="title" type="text" required>

        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
          required
        ></textarea>

        <label for="prep-time">Prep time in minutes</label>
        <input
          id="prep-time"
          name="prep_time"
          type="number"
          min="0"
          required
        >

        <label for="cook-time">Cook time in minutes</label>
        <input
          id="cook-time"
          name="cook_time"
          type="number"
          min="0"
          required
        >
        <button type="submit">Update Recipe</button>
        <p id="form-message" aria-live="polite">
          Loading recipe...
        </p>
      </form>

      <section class="relationship-editor">
        <p class="section-label">What you'll need</p>
        <h2>Ingredients</h2>
        <div class="ingredient-editor-grid">
          <ul class="ingredient-list" data-ingredient-list>
            <li>Loading ingredients...</li>
          </ul>

          <form id="ingredient-form" class="recipe-form">
            <label for="ingredient-id">Choose an existing ingredient</label>
            <select id="ingredient-id" name="ingredient_id">
              <option value="">Choose an ingredient</option>
            </select>

            <label for="ingredient-name">Or create a new ingredient</label>
            <input
              id="ingredient-name"
              name="ingredient_name"
              type="text"
            >

            <label for="ingredient-amount">Amount</label>
            <input
              id="ingredient-amount"
              name="amount"
              type="text"
              required
            >

            <label for="ingredient-unit">Unit</label>
            <input
              id="ingredient-unit"
              name="unit"
              type="text"
              required
            >

            <button type="submit">Save Ingredient</button>
            <p id="ingredient-message" aria-live="polite"></p>
          </form>
        </div>
      </section>

      <section class="relationship-editor">
        <p class="section-label">Make it</p>
        <h2>Recipe Steps</h2>

        <ol class="step-editor-list" data-step-editor-list>
          <li>Loading recipe steps...</li>
        </ol>

        <div class="step-editor-actions">
          <button type="button" data-add-step>Add Step</button>
          <button type="button" data-save-steps>Save Steps</button>
        </div>

        <p id="step-message" aria-live="polite"></p>
      </section>

      <section class="relationship-editor">
        <p class="section-label">Organize it</p>
        <h2>Recipe Tags</h2>

        <div class="tag-editor-grid">
          <ul class="tag-editor-list" data-tag-editor-list>
            <li>Loading recipe tags...</li>
          </ul>

          <form id="tag-form" class="recipe-form">
            <label for="tag-id">Choose an existing tag</label>
            <select id="tag-id" name="tag_id">
              <option value="">Choose a tag</option>
            </select>

            <label for="tag-name">Or create a new tag</label>
            <input id="tag-name" name="tag_name" type="text">

            <label for="tag-type">Tag type</label>
            <input
              id="tag-type"
              name="tag_type"
              type="text"
              list="tag-type-options"
            >
            <datalist id="tag-type-options">
              <option value="region"></option>
              <option value="style"></option>
              <option value="dish"></option>
              <option value="collection"></option>
            </datalist>

            <button type="submit">Save Tag</button>
            <p id="tag-message" aria-live="polite"></p>
          </form>
        </div>
      </section>

    </main>

    <script src="{{ url_for('static', filename='edit_recipe.js') }}"></script>
  </body>
</html>
