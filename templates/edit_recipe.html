<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Recipe | Kitchen Roots</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='recipe.css') }}"
    >
  </head>

  <body>
    <header class="site-header">
      <a class="brand" href="/recipes">Kitchen Roots</a>
      <span>Preserve a recipe from your kitchen.</span>
    </header>

    <main class="recipe-shell form-page">
      <header class="recipe-header">
        <p class="eyebrow">Update your recipe</p>
        <h1>Edit Recipe</h1>
      </header>

      <form
        id="edit-recipe-form"
        class="recipe-form"
        data-recipe-id="{{ recipe_id }}"
      >
        <label for="title">Title</label>
        <input id="title" name="title" type="text" required>

        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
          required
        ></textarea>

        <label for="prep-time">Prep time in minutes</label>
        <input
          id="prep-time"
          name="prep_time"
          type="number"
          min="0"
          required
        >

        <label for="cook-time">Cook time in minutes</label>
        <input
          id="cook-time"
          name="cook_time"
          type="number"
          min="0"
          required
        >

        <button type="submit">Update Recipe</button>
        <p id="form-message" aria-live="polite">
          Loading recipe...
        </p>
      </form>
    </main>

    <script src="{{ url_for('static', filename='edit_recipe.js') }}"></script>
  </body>
</html>
